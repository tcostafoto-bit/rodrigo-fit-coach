<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Rodrigo FC</title>
<meta name="theme-color" content="#0B2E20">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rodrigo FC">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --pitch:#0B2E20; --pitch2:#113D2B; --pitch3:#17503A; --line:rgba(255,255,255,.14); --line2:rgba(255,255,255,.28);
  --ink:#F4F7F2; --ink2:#B9CDBF; --ink3:#7E9A88;
  --gold:#F2D04B; --gold2:#C9A836; --red:#E8553D; --green:#5FD38D; --card:#FFFFFF; --card-ink:#102219; --card-ink2:#4C6457; --card-line:#E3E9E4;
  --mot:#F2D04B;
  --sat:env(safe-area-inset-top); --sab:env(safe-area-inset-bottom);
  --disp:"Big Shoulders Display",Impact,sans-serif; --sans:"Instrument Sans",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--pitch);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
body{min-height:100vh;background-image:
  linear-gradient(var(--line) 1px, transparent 1px);
  background-size:100% 44px}
button{font-family:inherit;font-size:inherit;color:inherit;border:0;background:none;padding:0;margin:0;cursor:pointer}
input,select{font-family:inherit;font-size:inherit}
h1,h2,h3{margin:0}
.disp{font-family:var(--disp);font-weight:800;letter-spacing:.01em;text-transform:uppercase;line-height:.95}
.mono{font-family:var(--mono);font-weight:600;font-variant-numeric:tabular-nums}
.hidden,[hidden]{display:none!important}
#app{max-width:520px;margin:0 auto;padding:calc(var(--sat) + 10px) 16px calc(var(--sab) + 84px)}
/* topo */
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:10px}
.brand .disp{font-size:26px}
.brand small{display:block;font-size:11px;color:var(--ink3);letter-spacing:.14em;text-transform:uppercase;font-weight:600}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);border-radius:999px;padding:5px 10px;font-size:12px;font-weight:600;color:var(--ink2)}
.pill b{color:var(--gold)}
/* cartões */
.card{background:var(--pitch2);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px;position:relative;overflow:hidden}
.card.white{background:var(--card);color:var(--card-ink);border-color:transparent}
.card.white .muted{color:var(--card-ink2)}
.card.gold{background:var(--gold);color:#1F1A05;border-color:transparent}
.hero{padding:20px 18px 18px;background:linear-gradient(160deg,var(--pitch3),var(--pitch2));border-color:var(--line2)}
.hero .bg{position:absolute;right:-30px;top:-20px;width:220px;opacity:.5;pointer-events:none}
.kicker{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);font-weight:700;margin-bottom:6px}
.hero .kicker{color:var(--gold)}
.hero h1{font-size:46px;margin:0 0 4px}
.hero .sub{color:var(--ink2);font-size:14px;margin-bottom:14px}
.muted{color:var(--ink2);font-size:14px}
.tiny{font-size:12px;color:var(--ink3)}
.row{display:flex;align-items:center;gap:10px}
.row.between{justify-content:space-between}
.grow{flex:1;min-width:0}
/* botões */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;border-radius:14px;font-weight:700;font-size:17px;padding:0 16px;transition:transform .08s}
.btn:active{transform:scale(.985)}
.btn.primary{background:var(--gold);color:#1F1A05}
.btn.dark{background:var(--pitch);color:var(--ink);border:1px solid var(--line2)}
.btn.ghost{background:transparent;color:var(--ink2);border:1px solid var(--line2);min-height:46px;font-size:15px}
.excard .btn.ghost{color:var(--card-ink);border-color:#C9D3CC}
.btn.white{background:#fff;color:var(--card-ink)}
.btn.sm{min-height:42px;font-size:14px;border-radius:12px;width:auto;padding:0 14px}
.btn.danger{background:var(--red);color:#fff}
.btn:disabled{opacity:.45}
.ib{width:42px;height:42px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line2);color:var(--ink);flex:0 0 auto}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line2);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600;color:var(--ink2)}
.chip.on{background:var(--gold);color:#1F1A05;border-color:var(--gold)}
.chip.sm{padding:4px 9px;font-size:12px}
/* semana / jornada */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:4px 0 2px}
.day{border-radius:10px;padding:8px 2px 6px;text-align:center;border:1px solid var(--line);font-size:11px;color:var(--ink2);line-height:1.15}
.day .d{font-family:var(--disp);font-size:16px;font-weight:800;color:var(--ink);margin-bottom:2px}
.day.today{border-color:var(--gold);background:rgba(242,208,75,.1)}
.day.today .d{color:var(--gold)}
.day.done{background:rgba(95,211,141,.15);border-color:rgba(95,211,141,.4)}
.day.gym .lab{color:var(--gold);font-weight:700}
.day.game .lab{color:#fff;font-weight:700}
.day .lab{display:block;font-size:10px;letter-spacing:.02em}
.day .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ink3);margin-top:3px}
.day.gym .dot{background:var(--gold)}.day.game .dot{background:#fff}.day.rest .dot{background:var(--red)}.day.club .dot{background:var(--green)}
/* lista de exercícios */
.exlist{display:flex;flex-direction:column;gap:8px}
.exrow{display:flex;align-items:center;gap:12px;background:var(--card);color:var(--card-ink);border-radius:14px;padding:10px 12px;width:100%;text-align:left}
.exrow.dark{background:var(--pitch);color:var(--ink);border:1px solid var(--line)}
.exrow .thumb{width:56px;height:42px;flex:0 0 auto;display:flex;align-items:center;justify-content:center}
.exrow .thumb .fig{width:56px}
.exrow .n{font-weight:700;font-size:15px;line-height:1.2}
.exrow .pt{font-size:12px;color:var(--card-ink2)}
.exrow.dark .pt{color:var(--ink3)}
.exrow .sch{font-family:var(--mono);font-size:13px;color:var(--card-ink2);white-space:nowrap}
.exrow.dark .sch{color:var(--ink2)}
.exrow.done{opacity:.55}
.exrow.cur{outline:2px solid var(--gold)}
.blockh{display:flex;align-items:center;justify-content:space-between;margin:14px 0 6px}
.blockh .disp{font-size:20px}
.blockh .tiny{font-weight:600}
/* figuras (desenhos de linha) */
.fig{display:block;width:100%;height:auto;stroke-linecap:round;stroke-linejoin:round;fill:none;--fb:#102219;--fp:#B5C3B9;--fa:#B38F12}
.dark .fig,.fig.dark{--fb:#F4F7F2;--fp:#4F6E5C;--fa:#F2D04B}
.fig .B{stroke:var(--fb);stroke-width:2.6}.fig .P{stroke:var(--fp);stroke-width:1.8}.fig .A{stroke:var(--fa);stroke-width:2.4}.fig .Af{fill:var(--fa);stroke:none}
.fig .M{stroke:var(--mot);stroke-width:1.8;stroke-dasharray:3 4;marker-end:url(#arr)}
.figbox{display:flex;justify-content:center;background:#F6F8F5;border-radius:14px;padding:6px;margin-bottom:12px}
.figbox .fig{width:150px}
/* separadores */
.tabs{position:fixed;left:0;right:0;bottom:0;background:rgba(11,46,32,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line2);display:flex;justify-content:space-around;padding:8px 6px calc(var(--sab) + 8px);z-index:20}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--ink3);padding:4px 0}
.tab svg{width:24px;height:24px}
.tab.on{color:var(--gold)}
/* modo treino */
#wk{position:fixed;inset:0;background:var(--pitch);z-index:30;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(var(--sat) + 10px) 16px calc(var(--sab) + 24px)}
#wk .inner{max-width:520px;margin:0 auto}
.score{display:flex;align-items:center;justify-content:space-between;background:#071F15;border:1px solid var(--line2);border-radius:14px;padding:8px 12px;margin-bottom:12px}
.score .t{font-family:var(--mono);font-size:22px;color:var(--gold)}
.score .lab{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);font-weight:700}
.score .prog{font-family:var(--mono);font-size:14px;color:var(--ink2)}
.excard{background:var(--card);color:var(--card-ink);border-radius:20px;padding:16px;margin-bottom:12px}
.excard .code{display:inline-block;font-family:var(--mono);font-size:12px;background:var(--pitch);color:var(--gold);border-radius:6px;padding:2px 7px;margin-bottom:8px}
.excard h2{font-family:var(--disp);font-size:30px;font-weight:800;text-transform:uppercase;line-height:.95;margin:0}
.excard .pt{color:var(--card-ink2);font-size:14px;margin:4px 0 10px}
.feel{border-left:3px solid var(--gold);padding:4px 10px;margin:10px 0;font-size:14px;line-height:1.35}
.feel b{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--card-ink2);margin-bottom:2px}
.feel.no{border-color:var(--red)}
.howto{font-size:14px;color:var(--card-ink);line-height:1.45;background:#F6F8F5;border-radius:12px;padding:10px 12px;margin-top:8px}
.howto summary{cursor:pointer;font-weight:700;list-style:none;display:flex;justify-content:space-between}
.howto summary::-webkit-details-marker{display:none}
.howto summary::after{content:"+";font-weight:700}
.howto[open] summary::after{content:"–"}
.howto p{margin:8px 0 0}
.hint{display:flex;gap:8px;align-items:flex-start;background:#FFF7D6;color:#5A4400;border-radius:12px;padding:9px 12px;font-size:13px;font-weight:600;margin-top:10px}
.sets{display:flex;gap:6px;margin:12px 0 6px;flex-wrap:wrap}
.set{flex:1;min-width:64px;border:1px solid var(--card-line);border-radius:12px;padding:8px 6px;text-align:center;font-family:var(--mono);font-size:14px;color:var(--card-ink2)}
.set.done{background:var(--pitch);color:var(--gold);border-color:var(--pitch)}
.set.next{border-color:var(--gold);border-width:2px;color:var(--card-ink)}
.set small{display:block;font-family:var(--sans);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:inherit;opacity:.7}
.kgrow{display:flex;align-items:center;justify-content:space-between;gap:8px;background:#F6F8F5;border-radius:14px;padding:8px 10px;margin:10px 0 4px}
.kgrow .k{font-family:var(--mono);font-size:24px;font-weight:600;color:var(--card-ink)}
.kgrow .u{font-size:12px;color:var(--card-ink2);margin-left:4px}
.kgrow .ib{border-color:var(--card-line);color:var(--card-ink);background:#fff}
.sugg{display:flex;align-items:center;justify-content:space-between;gap:8px;background:#E6F6EC;color:#13482A;border-radius:12px;padding:8px 12px;font-size:13px;font-weight:600;margin-top:6px}
.sugg .btn{width:auto;min-height:34px;font-size:13px;padding:0 12px;background:#13482A;color:#fff;border-radius:9px}
.acts{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.acts .two{display:flex;gap:8px}
.acts .two .btn{flex:1}
.eff{display:flex;gap:6px;margin-top:10px}
.eff button{flex:1;border:1px solid var(--card-line);border-radius:12px;padding:10px 4px;font-weight:700;font-size:14px;color:var(--card-ink)}
.eff button.on{background:var(--pitch);color:var(--gold);border-color:var(--pitch)}
.ssbar{display:flex;align-items:center;gap:8px;background:rgba(242,208,75,.12);border:1px solid rgba(242,208,75,.4);border-radius:12px;padding:8px 12px;margin-bottom:10px;font-size:13px;color:var(--ink2)}
.ssbar b{color:var(--gold)}
/* descanso */
.restov{position:fixed;inset:0;background:rgba(7,31,21,.97);z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
.restov .lab{font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink3);font-weight:700;margin-bottom:10px}
.restov .ring{position:relative;width:220px;height:220px;margin-bottom:16px}
.restov .ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.restov .ring .t{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:56px;color:var(--gold)}
.restov .next{color:var(--ink2);margin-bottom:18px;font-size:15px;max-width:320px}
.restov .next b{color:var(--ink);display:block;font-family:var(--disp);font-size:24px;text-transform:uppercase}
.restov .acts{width:100%;max-width:320px}
/* folha (sheet) */
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;display:flex;align-items:flex-end}
#sheet .pane{background:var(--pitch2);border-radius:22px 22px 0 0;width:100%;max-width:520px;margin:0 auto;max-height:86vh;overflow-y:auto;padding:16px 16px calc(var(--sab) + 20px);border-top:1px solid var(--line2)}
#sheet .handle{width:40px;height:4px;border-radius:2px;background:var(--line2);margin:0 auto 14px}
.sheet-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.sheet-h .disp{font-size:24px}
/* fim */
.fin{text-align:center;padding:26px 10px}
.fin .disp{font-size:54px;color:var(--gold)}
.fin .stats{display:flex;justify-content:center;gap:18px;margin:16px 0 20px}
.fin .stats div{text-align:center}
.fin .stats .v{font-family:var(--mono);font-size:28px;color:var(--ink)}
.fin .stats .l{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);font-weight:700}
/* histórico/perfil */
.hist{display:flex;flex-direction:column;gap:6px}
.hist .it{display:flex;justify-content:space-between;align-items:center;background:var(--pitch);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14px}
.hist .it .mono{color:var(--gold);font-size:13px}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat div{background:var(--pitch);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.stat .v{font-family:var(--mono);font-size:24px;color:var(--gold)}
.stat .l{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);font-weight:700}
.kv{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv:last-child{border-bottom:0}
.kv .k{color:var(--ink2)}
.kv .v{font-family:var(--mono);color:var(--ink)}
.nutri h3{font-family:var(--disp);font-size:22px;text-transform:uppercase;margin:16px 0 8px;color:var(--gold)}
.nutri .it{background:var(--card);color:var(--card-ink);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.nutri .it b{display:block;margin-bottom:3px}
.nutri .it span{font-size:14px;color:var(--card-ink2)}
.check ul{margin:6px 0 0;padding-left:18px;font-size:14px;color:var(--card-ink)}
.check li{margin:5px 0}
.alert{display:flex;gap:10px;align-items:flex-start;background:rgba(232,85,61,.12);border:1px solid rgba(232,85,61,.45);border-radius:14px;padding:10px 12px;font-size:13px;color:var(--ink);margin-bottom:12px}
.alert b{color:#FF8F7A}
.toast{position:fixed;left:50%;bottom:calc(var(--sab) + 96px);transform:translateX(-50%);background:#fff;color:var(--card-ink);padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;z-index:60;box-shadow:0 6px 24px rgba(0,0,0,.35);white-space:nowrap}
.q{display:flex;gap:8px;margin-top:10px}
.q .btn{flex:1;min-height:46px;font-size:15px}
label.sw{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
label.sw input{width:22px;height:22px;accent-color:var(--gold)}
select.sel{background:var(--pitch);color:var(--ink);border:1px solid var(--line2);border-radius:10px;padding:8px 10px}
.ball{display:inline-block;width:14px;height:14px;border-radius:50%;border:2px solid currentColor;vertical-align:-2px;margin-right:4px}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs><marker id="arr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#F2D04B"/></marker></defs></svg>
<div id="app"></div>
<nav class="tabs" id="tabs"></nav>
<div id="wk" hidden></div>
<div id="sheet" hidden></div>
<script src="https://cdn.jsdelivr.net/npm/nosleep.js@0.12.0/dist/NoSleep.min.js" defer></script>
<script>
/* Biblioteca base reaproveitada da Diana Fit Coach (gerada por tools/extract) */
var LIB_BASE = [["Bicicleta Estática – Aquecimento","cardio","Ritmo confortável em que consegues falar sem ficar sem fôlego — só para aquecer.","Sentado na bicicleta estática"],
["Passadeira – Aquecimento","cardio","Caminhada rápida ou corrida leve, ritmo em que consegues falar. Só para aquecer.","Passadeira"],
["Alongamento do Mundo (World's Greatest)","mobilidade","Afundo grande, mão do lado da perna da frente no chão, roda o outro braço para o teto olhando para a mão. Abre anca, coluna torácica e posteriores de uma vez — o melhor aquecimento que há.","No chão, em posição de afundo com a mão apoiada"],
["Ponte Glúteos (Peso Corporal)","gluteo","Deitado, empurra a anca para cima apertando o glúteo, sem arquear demasiado a lombar.","Deitado de costas no chão"],
["Ponte Glúteos Unilateral","gluteo","Deitada, uma perna esticada no ar. Empurra a anca para cima com a outra perna, aperta o glúteo em cima e desce devagar.","Deitada de costas, um pé no chão"],
["Cat-Camel (Chão)","mobilidade","De quatro apoios, arqueia e depois arredonda a coluna lentamente, sincronizando com a respiração.","No chão, de quatro apoios"],
["Bird Dog (Chão)","core","De quatro apoios, estica o braço e a perna opostos mantendo as costas estáveis, sem rodar a bacia.","No chão, de quatro apoios"],
["Joelhos ao Peito","cardio","Corrida no lugar trazendo os joelhos à altura da anca, braços a acompanhar. Rápido.","De pé, espaço livre"],
["Agachamento (Peso Corporal)","perna","Pés à largura dos ombros, desce a anca para trás e para baixo até as coxas ficarem paralelas ao chão, sobe empurrando o chão. Peso no meio do pé.","De pé, espaço livre"],
["Agachamento Tempo 3-1-1","perna","Desce em 3 segundos, para 1 segundo no fundo e sobe em 1. O tempo lento substitui a carga.","De pé, espaço livre"],
["Box Jump","perna","Pés à largura da anca, salta para cima da caixa e aterra suave com os joelhos dobrados. Desce a pé (não saltes para baixo).","De pé de frente para a caixa"],
["Salto em Comprimento","perna","Dobra a anca e os joelhos, balança os braços e salta o mais longe possível para a frente. Aterra suave e caminha de volta.","De pé, espaço livre à frente"],
["Skaters","cardio/perna","Salta de lado para um pé, o outro cruza atrás, e volta para o outro lado. Como patinar.","De pé, espaço livre"],
["Afundo com Salto","perna","Em afundo, salta e troca de perna no ar, aterra em afundo do outro lado. Tronco direito, joelho da frente por cima do pé.","De pé, espaço livre"],
["Goblet Squat (Halter)","perna","Halter junto ao peito com as duas mãos, desce entre os joelhos mantendo o tronco vertical.","De pé, halter junto ao peito"],
["Flexões (Padrão)","peito","Mãos à largura dos ombros, corpo reto da cabeça aos calcanhares, desce até quase tocar o chão.","No chão, mãos e pontas dos pés apoiadas"],
["Flexões em Incline","peito","Mãos numa superfície elevada — versão mais fácil, boa para a técnica.","Mãos numa superfície elevada, pés no chão"],
["Remada Baixa Sentada","costas","Pés nos apoios, joelhos ligeiramente fletidos, tronco direito. Puxa a pega ao umbigo juntando as omoplatas, segura 1s e volta sem arredondar as costas. O tronco não balança.","Sentado no tapete de frente para a máquina, pés nos apoios, polia baixa"],
["Stepup (Banco + Halteres)","perna","Sobe ao banco com uma perna empurrando pelo calcanhar, desce controlado sem saltar.","De pé junto ao banco, halteres nas mãos"],
["Puxada Alta (Barra Larga)","costas","Pega mais larga que os ombros, peito alto. Puxa a barra até cima do peito levando os cotovelos para baixo e para trás. Sobe controlado até esticar os braços e sente as costas laterais a alongar.","Sentado de frente para a torre, coxas presas por baixo dos rolos, barra na polia alta"],
["Puxada Pega Fechada (Supinada)","costas","Mãos à largura dos ombros, palmas viradas para ti. Puxa até ao peito com os cotovelos junto ao corpo. Trabalha mais a parte de baixo das costas e o bíceps que a pega larga.","Sentado de frente para a torre, coxas presas, barra na polia alta"],
["Hip Thrust (Barra)","gluteo","Ombros apoiados no banco, barra na anca, empurra para cima apertando o glúteo no topo, sem hiperestender a lombar.","Sentado no chão com os ombros apoiados no banco, barra na anca"],
["Shoulder Press (Máquina)","ombros","Pegas à altura das orelhas, costas no encosto. Empurra para cima sem arquear a lombar e desce devagar até às orelhas.","Sentada na shoulder press, pegas ao lado da cabeça"],
["Pallof Press (Polia)","core","Pega à altura do peito, de lado para a polia. Estica os braços à frente e aguenta 2s sem deixar o tronco rodar. Volta e repete.","De pé de lado para a polia a meia altura"],
["Prancha Lateral (Cada lado)","core","De lado, apoiado no antebraço, corpo alinhado, anca elevada sem cair.","No chão, de lado, apoiado num antebraço"],
["Prancha (Frontal)","core","Antebraços no chão, corpo reto da cabeça aos calcanhares, aperta o abdómen e o glúteo sem deixar a anca cair.","No chão, antebraços apoiados"],
["Dead Bug (Chão)","core","Deitado, estica ao mesmo tempo o braço e a perna opostos, lombar sempre colada ao chão.","Deitado de costas no chão"],
["Hamstring Walkout","perna","Em ponte de glúteos, caminha com os calcanhares para a frente até quase esticar as pernas, mantendo a anca alta, e volta atrás.","Deitada de costas, ponte de glúteos"],
["Hollow Hold","core","Deitada de costas, lombar colada ao chão, braços e pernas esticados a uns centímetros do chão. Aguenta o tempo indicado sem a lombar descolar. Se for demais, dobra os joelhos.","Deitada de costas no tapete"],
["Superman","core","De barriga para baixo, braços à frente. Levanta ao mesmo tempo braços, peito e pernas do chão, aguenta 2s e desce.","Deitada de barriga para baixo no tapete"],
["Clamshell c/ Mini Band","gluteo","Deitada de lado, joelhos dobrados, mini band acima dos joelhos. Abre o joelho de cima como uma concha sem rodar a bacia, segura 1s e fecha devagar.","Deitada de lado, mini band nos joelhos"],
["Leg Press (Máquina)","perna","Pés à largura da anca, a meio da plataforma. Solta a segurança, desce a plataforma até os joelhos fazerem 90° sem a lombar descolar do encosto, e empurra pelos calcanhares até quase esticar — nunca bloqueies os joelhos.","Sentada na leg press, costas e anca coladas ao encosto"],
["Supino c/ Halteres","peito","Halteres descem ao nível do peito e empurra para cima juntando-os ligeiramente no topo.","Deitado no banco na horizontal, halteres nas mãos"],
["Supino Inclinado (Halteres)","peito","Banco a 30-45°, halteres descem ao peito superior com os cotovelos a 45°.","Banco a 30-45°, halteres nas mãos"],
["Leg Curl Deitada (Máquina)","perna","Rolo por cima dos tornozelos, anca colada ao banco. Traz os calcanhares aos glúteos com 1s de aperto no topo e desce devagar. Se a anca levanta, o peso é demais.","Deitada de barriga para baixo na máquina, rolo atrás dos tornozelos"],
["Leg Curl Sentada (Máquina)","perna","Almofada por cima das coxas, rolo atrás dos tornozelos. Dobra os joelhos puxando o rolo para baixo e para trás, segura 1s, volta controlado.","Sentada na máquina, costas no encosto, coxas presas"],
["Remada c/ Apoio ao Peito (Máquina)","costas","Peito apoiado na almofada, puxa as pegas para trás com os cotovelos junto ao corpo, junta as omoplatas e volta devagar. O tronco não sai da almofada.","Sentada na máquina, peito apoiado na almofada"],
["Remada com Halteres (Unilateral)","costas","Um joelho e uma mão apoiados no banco, puxa o halter até à cintura com o cotovelo junto ao corpo.","Joelho e mão apoiados no banco, halter na outra mão"],
["Remada Invertida (Mesa)","costas","Deitada por baixo de uma mesa robusta, agarra a borda com os braços esticados e puxa o peito até à mesa, corpo reto. Pés mais perto = mais fácil.","Deitada por baixo de uma mesa robusta"],
["Afundo Inverso","perna","Dá um passo grande para trás e desce até o joelho de trás quase tocar o chão, volta à posição inicial empurrando com a perna da frente. Alterna.","De pé, espaço livre"],
["Afundo Búlgaro (Banco + Halter)","perna/gluteo","Pé de trás apoiado no banco, desce a perna da frente até 90° sem o joelho passar muito a ponta do pé.","De pé, pé de trás apoiado no banco, halteres nas mãos"],
["Afundo Caminhando (Halteres)","perna","Passo grande para a frente, desce até o joelho de trás quase tocar o chão, avança alternando as pernas.","De pé, halteres nas mãos, espaço livre para andar"],
["Face Pull (Polia)","ombros","Corda na polia alta, recua um passo. Puxa na direção da testa com os cotovelos altos e abre as mãos no fim. Leve e controlado.","De pé, recuada da polia alta, corda nas mãos"],
["Elevação Lateral (Halteres)","ombros","Halteres ao lado do corpo, cotovelos ligeiramente fletidos. Eleva os braços de lado até à linha dos ombros sem encolher o trapézio e desce devagar.","De pé, halteres nas mãos"],
["Monster Walk (c/ Elástico nos joelhos)","gluteo","Elástico nos joelhos, dá passos laterais mantendo tensão constante.","De pé, elástico nos joelhos"],
["Mountain Climbers","cardio/core","Em prancha alta, traz os joelhos ao peito alternando rápido, mantendo a anca estável.","No chão, em prancha alta"],
["Corda de Saltar","cardio","Saltos pequenos e rápidos, pulsos a rodar a corda. Sem corda, faz o mesmo movimento a simular.","De pé, espaço livre"],
["Polichinelos","cardio","Salta abrindo pernas e braços ao mesmo tempo, fecha e repete. Ritmo constante.","De pé, espaço livre"],
["Alongamento Flexores da Anca","mobilidade","Empurra a anca para a frente até sentir a frente da anca da perna de trás a esticar, tronco direito, glúteo apertado. Essencial para quem passa horas sentada.","Meio-joelho no chão (perna de trás ajoelhada)"],
["Alongamento Posteriores (Hamstrings)","mobilidade","Perna esticada, inclina o tronco à frente com as costas direitas até sentir atrás da coxa. Não arredondes a lombar.","De pé, calcanhar apoiado no banco"],
["Alongamento Gémeos (Parede)","mobilidade","Mãos na parede, uma perna atrás esticada com o calcanhar no chão. Avança a anca até sentir a barriga da perna.","De pé, mãos na parede"],
["Alongamento Quadricípite (De Pé)","mobilidade","De pé, puxa o calcanhar ao glúteo com a mão do mesmo lado, joelhos juntos e anca à frente. Apoia-te se precisares.","De pé, numa perna"],
["Alongamento Glúteo (Figura 4)","mobilidade","Tornozelo sobre o joelho oposto, puxa a coxa ao peito até sentir o glúteo. Solta a anca para a rotação.","Deitado de costas no chão"],
["Alongamento Peitoral (Porta)","mobilidade","Antebraço no aro da porta, roda o corpo para o lado oposto até sentir o peito a abrir.","De pé, antebraço no aro da porta"],
["Alongamento Tríceps e Ombro","mobilidade","Braço acima da cabeça, cotovelo dobrado com a mão nas costas. Com a outra mão puxa o cotovelo suavemente.","De pé ou sentada"],
["Extensão de Pernas (Máquina)","perna","Joelhos alinhados com o eixo da máquina, rolo por cima dos tornozelos. Estica as pernas, aperta a coxa 1s em cima e desce devagar sem deixar cair.","Sentada na máquina, costas no encosto"],
["Abdutora (Máquina)","gluteo","Almofadas do lado de fora dos joelhos. Abre as pernas contra a resistência sem inclinar o tronco, segura 1s aberto e fecha devagar. Inclinar o tronco à frente carrega mais o glúteo.","Sentada na abdutora, almofadas por fora dos joelhos"],
["Adutora (Máquina)","perna","Almofadas do lado de dentro dos joelhos. Fecha as pernas apertando o interior das coxas, segura 1s e abre devagar até onde controlas.","Sentada na adutora, almofadas por dentro dos joelhos"],
["Kettlebell Swing","gluteo","Pés um pouco mais largos que a anca, kettlebell entre as pernas. Dobra a anca para trás (não é squat), deixa o KB passar entre as coxas e estica a anca com força até o KB chegar à altura do peito. Braços soltos, é a anca que manda.","De pé, kettlebell no chão à frente"],
["Abdução de Anca Deitada","gluteo","Deitada de lado, perna de cima esticada. Sobe a perna até 45° com o pé a apontar em frente (não para cima), desce devagar. Mini band nos tornozelos para dificultar.","Deitada de lado, perna de cima esticada"],
["Farmer's Carry (Halteres)","core","Halteres pesados nas mãos, ombros para trás e para baixo, caminha o tempo ou distância indicados sem inclinar para nenhum lado.","De pé, halteres ao lado do corpo"],
["Russian Twist","core","Sentada com o tronco inclinado para trás e os pés no ar (ou no chão para facilitar), roda o tronco tocando com as mãos no chão de cada lado.","Sentada no tapete, tronco inclinado"],
["V-Up","core","Deitada esticada, sobe ao mesmo tempo o tronco e as pernas até as mãos tocarem os pés (forma um V) e desce controlado.","Deitada de costas no tapete"],
["Bicicleta (Abdominal)","core","Deitada, mãos atrás da cabeça. Traz o cotovelo ao joelho oposto enquanto esticas a outra perna, alternando com ritmo controlado.","Deitada de costas no tapete"],
["Marcha no Lugar","cardio","Marcha rápida no lugar, joelhos altos, braços a balançar. Só para aquecer.","De pé"],
["Corrida no Lugar","cardio","Corrida no lugar, ritmo rápido, calcanhares ao glúteo ou joelhos altos alternados.","De pé"],
["Burpees","cardio","Agacha, prancha, flexão opcional, salta de volta e salta para cima esticando o corpo.","No chão, espaço livre à volta"],
["Woodchop (Polia)","core","Pega com as duas mãos junto ao ombro, roda anca e tronco juntos e puxa em diagonal até à anca oposta. A força vem da rotação, não dos braços.","De pé de lado para a polia alta"],
["Deadlift (Barra)","costas/perna","Barra rente às canelas, costas neutras, empurra o chão com as pernas e estica a anca — a barra fica sempre perto do corpo.","De pé, barra no chão junto às canelas"],
["RDL (Barra)","perna/gluteo","Joelhos quase esticados, desce a barra rente às pernas dobrando a anca até sentir o alongamento nos posteriores, sobe apertando o glúteo.","De pé, barra à frente das coxas"]];

["Lançamento Rotacional c/ Bola Medicinal (Parede)","core","De lado para a parede, bola à altura da anca. Roda as ancas e o tronco e atira a bola contra a parede com força. O poder vem das pernas e das ancas, não dos braços. Apanha e repete.","De lado para a parede, a 1 m, bola medicinal de 3 kg"],
["Slam c/ Bola Medicinal","core","Bola acima da cabeça, estica o corpo todo e atira-a ao chão com força, agachando ao mesmo tempo. Apanha no ressalto e repete. Usa bola que não salta muito.","De pé, bola medicinal (slam ball) de 4–6 kg"],
["Saltos Pogo (Pogo Jumps)","perna","Saltos pequenos e rápidos no lugar, só com os tornozelos, joelhos quase esticados. Pouco tempo no chão, como se o chão queimasse. Aterra nas pontas dos pés com os calcanhares a tocar ao de leve.","De pé, pés juntos"],
["RDL (Halteres)","perna","Halteres encostados às coxas. Empurra a anca para trás com as costas direitas e os joelhos só um pouco dobrados, descendo os halteres ao longo das pernas até sentir a parte de trás das coxas a esticar (mais ou menos a meio da canela). Volta a subir apertando os glúteos.","De pé, um halter em cada mão à frente das coxas"],
["Press de Ombros (Halteres Sentado)","ombros","Costas no encosto, halteres à altura das orelhas com as palmas para a frente. Empurra para cima até os braços ficarem quase esticados, sem bloquear, e desce devagar. Não arqueies as costas nem empurres com o pescoço.","Sentado num banco com encosto alto, um halter em cada mão"],
["Prancha de Copenhaga (Joelho Apoiado)","core","Deitado de lado, cotovelo no chão por baixo do ombro, joelho de cima apoiado num banco. Levanta a anca até o corpo ficar em linha e segura. Sentes a parte de dentro da coxa de cima a trabalhar. Isto protege as virilhas no futebol.","De lado no chão junto a um banco, joelho de cima em cima do banco"],
["Nordic Assistido (Elástico)","perna","De joelhos, tornozelos presos (barra baixa ou alguém a segurar), elástico preso à frente e à volta do peito para ajudar. Desce o tronco para a frente DEVAGAR, a travar com a parte de trás das coxas, e amortece com as mãos no chão. Empurra com as mãos para voltar. Só 3 repetições, todas lentas.","De joelhos num tapete, tornozelos presos, elástico à frente"],
["Elevação de Gémeos a Uma Perna (Degrau)","perna","Ponta do pé no degrau, calcanhar no ar, mão apoiada para equilíbrio. Desce o calcanhar abaixo do degrau até sentir o gémeo a esticar e sobe até ficar em bicos de pés. Devagar nas duas direções.","De pé num degrau, só um pé apoiado, mão na parede"],
["Alongamento Adutores (Borboleta)","mobilidade","Sentado, plantas dos pés juntas, joelhos abertos. Agarra os pés e deixa os joelhos caírem para o chão sem os empurrar com as mãos. Costas direitas. Respira fundo e deixa a parte de dentro das coxas abrir.","Sentado no chão, plantas dos pés juntas"],
["Agachamento Isométrico na Parede (Wall Sit)","perna","Costas na parede, desliza até as coxas ficarem paralelas ao chão, joelhos por cima dos tornozelos. Segura, a respirar. Mãos fora das coxas.","Encostado a uma parede"],
["Afundo Inverso (Halteres)","perna","Dá um passo largo para trás e baixa o joelho de trás até quase tocar o chão. O joelho da frente fica por cima do pé. Empurra pelo calcanhar da frente para voltar. Tronco direito.","De pé, um halter em cada mão"],
["Y-W-T (Deitado de Barriga para Baixo)","costas","Deitado de barriga para baixo, testa no chão. Levanta os braços do chão fazendo um Y, segura 2s, depois um W (cotovelos dobrados), depois um T. Aperta as omoplatas, polegares para cima. Isto arruma os ombros e a postura.","Deitado de barriga para baixo num tapete"],
["Rotação Torácica (Livro Aberto)","mobilidade","Deitado de lado, joelhos dobrados a 90°, braços esticados à frente um em cima do outro. Abre o braço de cima como um livro, rodando o peito para o outro lado, e segue a mão com o olhar. Joelhos ficam colados ao chão. Volta devagar.","Deitado de lado num tapete, joelhos dobrados"],
["Alongamento 90/90 (Ancas)","mobilidade","Sentado com a perna da frente dobrada a 90° à frente e a de trás dobrada a 90° ao lado. Tronco direito, inclina-te para a frente por cima da canela da frente até sentir o glúteo a esticar. Troca de lado.","Sentado no chão, pernas dobradas a 90°"],
["Prancha c/ Elevação de Perna","core","Em prancha nos cotovelos, levanta uma perna esticada uns centímetros sem rodar a anca, segura 1s e troca. A anca fica quieta como se tivesses um copo de água nas costas.","Prancha frontal nos cotovelos"],
["Marcha c/ Joelho Alto (Lenta)","mobilidade","Sobe um joelho ao peito, aguenta 1s em equilíbrio com o tronco direito e o pé de apoio firme, e troca. Devagar e controlado — é ativação, não corrida.","De pé"]

function pad(n){ return (n < 10 ? "0" : "") + n; }
function iso(d){ return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
function today(){ return iso(new Date()); }
function fromIso(s){ return new Date(s + "T12:00:00"); }
function addDays(d, n){ var x = new Date(d.getTime()); x.setDate(x.getDate() + n); return x; }
function monday(d){ var x = new Date(d.getTime()); x.setHours(12,0,0,0); var w = (x.getDay() + 6) % 7; x.setDate(x.getDate() - w); return x; }
function weekKey(d){ return iso(monday(d)); }
function weekNum(){ if (!st.firstDate) return 1; var a = monday(fromIso(st.firstDate)), b = monday(new Date()); return Math.max(1, Math.round((b - a) / 604800000) + 1); }
function phase(){ return weekNum() >= 4 ? 2 : 1; }
function fmtDate(s){ var p = s.split("-"); return p[2] + "/" + p[1]; }
function mmss(sec){ sec = Math.max(0, Math.floor(sec)); return pad(Math.floor(sec / 60)) + ":" + pad(sec % 60); }

/* ---------- esquemas ---------- */
function parseScheme(s){
  var m = /^(\d+)\s*[×x]\s*(.+)$/.exec(s || ""); if (!m) return {sets:1, reps:null, secs:null, side:false, label:s||""};
  var rest = m[2], side = /\/lado/.test(rest); rest = rest.replace("/lado", "").trim();
  var secs = null, reps = null, t;
  if ((t = /^(\d+)\s*min$/.exec(rest))) secs = parseInt(t[1], 10) * 60;
  else if ((t = /^(\d+)\s*s$/.exec(rest))) secs = parseInt(t[1], 10);
  else reps = parseInt(rest, 10) || null;
  return {sets:parseInt(m[1], 10), reps:reps, secs:secs, side:side, label:rest + (side ? "/lado" : "")};
}
function refKg(ref){ var m = /([\d.,]+)\s*kg/.exec(ref || ""); return m ? parseFloat(m[1].replace(",", ".")) : null; }
function perHand(ref){ return /\/mão/.test(ref || ""); }
function hasLoad(it){ return refKg(it[2]) != null; }
function curKg(it){ var k = it[0]; if (st.weights[k] != null && st.weights[k] !== "") return parseFloat(st.weights[k]); return refKg(it[2]); }
function fmtKg(n){ return (Math.round(n * 10) / 10).toString().replace(".", ","); }
function unitOf(it){ return perHand(it[2]) ? "kg/mão" : "kg"; }
function incOf(it){ return (perHand(it[2]) || /Halter|Goblet|Bola/.test(it[0])) ? 1 : 2.5; }

function sessionDef(key){ return SESSIONS[key] || SPECIAL[key] || null; }
function isStrength(key){ return !!SESSIONS[key]; }
function resolveSession(key, light){
  var def = sessionDef(key); if (!def) return null;
  var sw = st.swaps[key] || {};
  var blocks = [];
  def.blocks.forEach(function(b, bi){
    if (light && b.kind === "power") return;
    var nb = {name:b.name, kind:b.kind, ss:!!b.ss, rest:b.rest || null, items:[]};
    b.items.forEach(function(it, ii){
      var x = it.slice();
      if (phase() === 2 && x[4]){ var p = x[4].split("|"); x = [p[0], p[1] || x[1], x[2], x[3]]; }
      var s = sw[bi + "." + ii]; if (s){ x = [s[0], x[1], s[1], x[3]]; }
      if (light && b.kind === "str"){ var ps = parseScheme(x[1]); if (ps.sets > 2) x[1] = x[1].replace(/^\d+/, String(ps.sets - 1)); }
      nb.items.push(x);
    });
    blocks.push(nb);
  });
  var mins = def.mins || (light ? 30 : 40);
  return {key:key, title:def.title, sub:(light ? "Versão leve · sem saltos, menos 1 série" : def.sub), fam:def.fam || null, mins:mins, blocks:blocks, light:!!light};

function weekState(d){ var k = weekKey(d); return st.week[k] || {game:null, big:false}; }

function gameDow(w){ if (w.game === false) return null; if (typeof w.game === "number") return w.game; return st.cfg.gameDow; }

function planFor(d){
  var w = weekState(d), g = gameDow(w), dow = d.getDay(), cfg = st.cfg;
  if (g != null){
    if (dow === g) return {kind:"game", title:"Dia de jogo", sub:"Boa sorte. A app só entra se o clube não aquecer.", run:"pregame", lab:"Jogo"};
    var until = (g - dow + 7) % 7, after = (dow - g + 7) % 7;
    if (until === 1) return {kind:"vespera", title:"Véspera de jogo", sub:"O plano diz 12 min a soltar e ativar.", run:"vespera", lab:"Véspera"};
    if (after === 1) return {kind:"recup", title:"Recuperação", sub:"15 min a soltar as pernas do jogo.", run:"recup", lab:"Recup."};
  }
  if (dow === cfg.restDay) return {kind:"rest", title:"Folga total", sub:"Hoje o corpo cresce. O plano é não fazer nada.", lab:"Folga"};
  var gym = (g == null ? cfg.gymDaysNoGame : cfg.gymDays);
  if (gym.indexOf(dow) >= 0){
    if (w.big && gym.indexOf(dow) > 0) return {kind:"club", title:"Treino do clube", sub:"Semana de jogo importante: só 1 ginásio esta semana.", lab:"Clube"};

}

function nextSetIdx(bi, ii, n){ for (var k = 0; k < n; k++){ if (!st.sess.done[bi + "." + ii + "." + k]) return k; } return -1; }
function isComplete(x){ return doneOf(x.bi, x.ii, x.n) >= x.n; }
function firstPending(day){ var xs = allItems(day); for (var i = 0; i < xs.length; i++){ if (!isComplete(xs[i])) return xs[i]; } return null; }
function elapsed(){ var s = st.sess; if (!s) return 0; return (s.accum + (s.running ? Date.now() - s.startedAt : 0)) / 1000; }
function startSession(key, light){
  if (st.sess && st.sess.key !== key){ if (!confirm("Tens um treino a meio (" + sessionDef(st.sess.key).title + "). Deitar fora e começar este?")) return; st.sess = null; }
  if (!st.sess){
    var day = resolveSession(key, light), sugg = {};
    if (isStrength(key) && phase() === 2){
      allItems(day).forEach(function(x){ var it = x.it; if (!hasLoad(it)) return; var e = st.effort[it[0]]; if (e && e.v === "facil" && e.full) sugg[it[0]] = Math.round((curKg(it) + incOf(it)) * 2) / 2; });
    }
    st.sess = {key:key, light:!!light, startedAt:Date.now(), accum:0, running:true, done:{}, focus:null, eff:{}, sugg:sugg, swapped:{}};
    var fp = firstPending(day); st.sess.focus = fp ? {bi:fp.bi, ii:fp.ii} : null;
  }
  if (!st.sess.running){ st.sess.running = true; st.sess.startedAt = Date.now(); }
  save(); ui.viewDone = null; ui.rest = null; ui.fin = null; closeSheet(); showWorkout(true); renderWorkout();
}
function showWorkout(on){ var el = document.getElementById("wk"); el.hidden = !on; document.body.style.overflow = on ? "hidden" : ""; if (on) wakeOn(); else wakeOff(); }
function focusItem(day){ var s = st.sess; if (s.focus) return {bi:s.focus.bi, ii:s.focus.ii}; var fp = firstPending(day); return fp ? {bi:fp.bi, ii:fp.ii} : null; }
function setFocus(bi, ii){ st.sess.focus = {bi:bi, ii:ii}; ui.rest = null; ui.viewDone = null; save(); renderWorkout(); try { document.getElementById("wk").scrollTo(0, 0); } catch(e){} }
function sideLabel(ps){ return ps.side ? " cada lado" : ""; }
function setLabel(it, ps){ return ps.secs != null ? (ps.secs >= 60 ? (ps.secs / 60) + " min" : ps.secs + " s") + sideLabel(ps) : ps.reps + " reps" + sideLabel(ps); }
function markSet(bi, ii){
  var day = sessDay(), b = day.blocks[bi], it = b.items[ii], ps = parseScheme(it[1]), k = nextSetIdx(bi, ii, ps.sets);
  if (k < 0) return;
  st.sess.done[bi + "." + ii + "." + k] = 1;
  if (hasLoad(it)) st.last[it[0]] = {kg:curKg(it), date:today()};
  play("tick");
  var complete = doneOf(bi, ii, ps.sets) >= ps.sets;
  if (b.ss){
    var other = ii === 0 ? 1 : 0, oit = b.items[other], ops = parseScheme(oit[1]);
    if (!complete || doneOf(bi, other, ops.sets) < ops.sets){
      /* alterna: A1 → descanso curto → A2 → descanso longo → A1 */
      var nextIi = doneOf(bi, other, ops.sets) < doneOf(bi, ii, ps.sets) ? other : ii;
      var secs = (nextIi === ii) ? b.rest.end : b.rest.mid;
      st.sess.focus = {bi:bi, ii:nextIi}; save(); startRest(secs, day, bi, nextIi); return;
    }
  } else if (!complete && b.rest){ save(); startRest(b.rest.mid, day, bi, ii); return; }
  else if (!complete){ save(); renderWorkout(); return; }
  save();
  if (complete && (b.kind === "warm" || b.kind === "stretch")){ advance(day); return; }
  renderWorkout(); /* mostra "como foi?" */
}
function advance(day){
  var fp = firstPending(day);
  if (!fp){ finishSession(day); return; }
  var cur = focusItem(day), curBlk = cur ? day.blocks[cur.bi] : null;
  var secs = (curBlk && curBlk.rest && fp.bi === cur.bi && curBlk.kind !== "warm") ? curBlk.rest.end : 0;
  st.sess.focus = {bi:fp.bi, ii:fp.ii}; save();
  if (secs && fp.blk.kind !== "warm" && fp.blk.kind !== "stretch") startRest(secs, day, fp.bi, fp.ii); else renderWorkout();
}
function setEffort(name, v){
  var day = sessDay(), x = allItems(day).filter(function(y){ return y.it[0] === name; })[0];
  st.sess.eff[name] = v; st.effort[name] = {v:v, full:x ? isComplete(x) : true, date:today()};
  if (v === "dificil" && x && hasLoad(x.it)) toast("Ok. Para a próxima a app não sobe o peso.");
  save(); advance(day);
}
function skipItem(bi, ii){ var day = sessDay(), ps = parseScheme(day.blocks[bi].items[ii][1]); for (var k = 0; k < ps.sets; k++) st.sess.done[bi + "." + ii + "." + k] = "skip"; st.sess.eff[day.blocks[bi].items[ii][0]] = "saltou"; save(); advance(day); }
function undoLast(){ var keys = Object.keys(st.sess.done); if (!keys.length) return; var last = keys[keys.length - 1]; delete st.sess.done[last]; var p = last.split("."); st.sess.focus = {bi:+p[0], ii:+p[1]}; ui.rest = null; save(); renderWorkout(); }
function changeKg(name, d, it){ var v = curKg(it); if (v == null) v = 0; v = Math.max(0, Math.round((v + d) * 2) / 2); st.weights[name] = v; save(); renderWorkout(); }
function startRest(secs, day, bi, ii){ ui.rest = {kind:"rest", total:secs, end:Date.now() + secs * 1000, bi:bi, ii:ii}; renderWorkout(); }
function startHold(secs, bi, ii){ unlockAudio(); play("start"); ui.rest = {kind:"hold", total:secs, end:Date.now() + secs * 1000, bi:bi, ii:ii}; renderWorkout(); }
function ringSvg(left, total){ var r = 100, c = 2 * Math.PI * r, p = total ? Math.max(0, left / total) : 0; return '<svg viewBox="0 0 220 220"><circle cx="110" cy="110" r="' + r + '" stroke="rgba(255,255,255,.12)" stroke-width="10" fill="none"/><circle cx="110" cy="110" r="' + r + '" stroke="#F2D04B" stroke-width="10" fill="none" stroke-linecap="round" stroke-dasharray="' + c + '" stroke-dashoffset="' + (c * (1 - p)) + '"/></svg>'; }
function renderRest(day){
  var r = ui.rest, left = (r.end - Date.now()) / 1000, it = day.blocks[r.bi].items[r.ii], ps = parseScheme(it[1]);
  var nxt = r.kind === "hold" ? '<div class="next">A fazer<b>' + esc(enName(it[0])) + '</b>' + setLabel(it, ps) + '</div>' : '<div class="next">A seguir<b>' + esc(enName(it[0])) + '</b>' + setLabel(it, ps) + (hasLoad(it) ? ' · ' + fmtKg(curKg(it)) + ' ' + unitOf(it) : '') + '</div>';
  return '<div class="restov"><div class="lab">' + (r.kind === "hold" ? "Aguenta" : "Descansa") + '</div><div class="ring">' + ringSvg(left, r.total) + '<div class="t">' + mmss(left) + '</div></div>' + nxt +
    '<div class="acts"><div class="two"><button class="btn dark" data-rest="plus">+15 s</button><button class="btn primary" data-rest="skip">' + (r.kind === "hold" ? "Feito" : "Já estou") + '</button></div></div></div>';
}
function renderWorkout(){
  var el = document.getElementById("wk");
  if (ui.fin){ el.innerHTML = '<div class="inner">' + ui.fin + '</div>'; return; }
  var day = sessDay(); if (!day){ showWorkout(false); return; }
  var xs = allItems(day), total = 0, done = 0;
  xs.forEach(function(x){ total += x.n; done += doneOf(x.bi, x.ii, x.n); });
  var f = focusItem(day), h = '<div class="inner">';
  h += '<div class="score"><div><div class="lab">' + esc(day.title) + '</div><div class="t" id="clock">' + mmss(elapsed()) + '</div></div><div style="text-align:right"><div class="prog">' + done + ' / ' + total + ' séries</div><div class="row" style="justify-content:flex-end;gap:6px;margin-top:4px"><button class="chip sm" data-wk="undo" ' + (Object.keys(st.sess.done).length ? "" : "disabled") + '>desfazer</button><button class="chip sm" data-wk="pause">' + (st.sess.running ? "pausa" : "retomar") + '</button><button class="chip sm" data-wk="end">terminar</button></div></div></div>';
  if (f){
    var b = day.blocks[f.bi], it = b.items[f.ii], ps = parseScheme(it[1]), name = it[0], ex = EX[name] || {}, fe = feelOf(name), dn = doneOf(f.bi, f.ii, ps.sets), nk = nextSetIdx(f.bi, f.ii, ps.sets);
    var complete = nk < 0;
    if (b.ss){ var oi = f.ii === 0 ? 1 : 0; h += '<div class="ssbar"><b>Supersérie</b> ' + (f.ii === 0 ? "1" : "2") + ' de 2 · depois ' + esc(enName(b.items[oi][0])) + ' · ' + b.rest.mid + 's entre os dois, ' + b.rest.end + 's no fim</div>'; }
    h += '<div class="excard"><span class="code">' + esc(b.name) + (b.ss ? " · " + (f.ii === 0 ? "A1" : "A2") : "") + '</span><h2>' + esc(enName(name)) + '</h2><div class="pt">' + esc(ptName(name)) + (ex.setup ? ' · ' + esc(ex.setup) : '') + '</div>';
    h += '<div class="figbox">' + fig(name) + '</div>';
    if (fe) h += '<div class="feel"><b>O que sentir</b>' + esc(fe[0]) + '</div><div class="feel no"><b>Evitar</b>' + esc(fe[1]) + '</div>';
    h += '<details class="howto"><summary>Como fazer</summary><p>' + esc(ex.howto) + '</p></details>';
    if (b.kind === "str") h += '<div class="hint">🎯 Pára quando ainda conseguias fazer 3. Nunca vais até ao fim.</div>';
    if (b.kind === "power") h += '<div class="hint">⚡ Cada salto é à séria: aterra em silêncio e descansa o tempo todo entre séries.</div>';
    if (name.indexOf("Nordic") === 0) h += '<div class="hint">🐢 Descida de 3–4 segundos. Só 3 repetições, todas perfeitas.</div>';
    /* peso */
    if (hasLoad(it)){
      var kg = curKg(it), sg = st.sess.sugg[name];
      h += '<div class="kgrow"><button class="ib" data-kg="-" data-name="' + esc(name) + '">−</button><div><span class="k">' + fmtKg(kg) + '</span><span class="u">' + unitOf(it) + '</span></div><button class="ib" data-kg="+" data-name="' + esc(name) + '">+</button></div>';
      if (phase() === 1) h += '<div class="tiny" style="text-align:center">Semanas 1–3: fica com este peso mesmo que seja fácil.</div>';
      else if (sg && kg < sg) h += '<div class="sugg"><span>Da última vez foi fácil. Sobe para ' + fmtKg(sg) + ' ' + unitOf(it) + '?</span><button class="btn" data-sugg="' + esc(name) + '" data-val="' + sg + '">Sim</button></div>';
    }
    /* séries */
    h += '<div class="sets">';
    for (var k = 0; k < ps.sets; k++){ var dk = st.sess.done[f.bi + "." + f.ii + "." + k]; h += '<div class="set ' + (dk ? "done" : (k === nk ? "next" : "")) + '"><small>série ' + (k + 1) + '</small>' + (dk === "skip" ? "–" : (ps.secs != null ? (ps.secs >= 60 ? (ps.secs / 60) + "′" : ps.secs + "s") : ps.reps)) + (ps.side ? "<small>cada lado</small>" : "") + '</div>'; }
    h += '</div>';
    h += '<div class="acts">';
    if (!complete){
      if (ps.secs != null) h += '<button class="btn primary" data-hold="' + ps.secs + '" data-bi="' + f.bi + '" data-ii="' + f.ii + '">Começar ' + setLabel(it, ps) + '</button>';
      else h += '<button class="btn primary" data-set="' + f.bi + '.' + f.ii + '">Série ' + (nk + 1) + ' feita</button>';
      h += '<div class="two"><button class="btn ghost" data-swapbtn="' + f.bi + '.' + f.ii + '" ' + (FAM[it[3]] ? "" : "disabled") + '>Trocar</button><button class="btn ghost" data-skip="' + f.bi + '.' + f.ii + '">Saltar</button></div>';
    } else {
      h += '<div class="tiny" style="text-align:center;font-weight:700;letter-spacing:.1em;text-transform:uppercase">Como foi?</div><div class="eff"><button data-eff="facil" data-name="' + esc(name) + '">Fácil</button><button data-eff="certo" data-name="' + esc(name) + '">Certo</button><button data-eff="dificil" data-name="' + esc(name) + '">Difícil</button></div>';
    }
    h += '</div></div>';
  }
  /* lista do treino */
  day.blocks.forEach(function(blk, bi){
    h += '<div class="blockh"><span class="disp">' + esc(blk.name) + '</span><span class="tiny">' + (blk.rest ? (blk.ss ? blk.rest.mid + "s / " + blk.rest.end + "s" : blk.rest.mid + "s descanso") : "seguido") + '</span></div><div class="exlist">';
    blk.items.forEach(function(it, ii){ var x = {bi:bi, ii:ii, n:parseScheme(it[1]).sets}; var isCur = f && f.bi === bi && f.ii === ii; h += '<button class="exrow ' + (isComplete(x) ? "done " : "") + (isCur ? "cur" : "") + '" data-focus="' + bi + '.' + ii + '"><div class="thumb">' + fig(it[0]) + '</div><div class="grow"><div class="n">' + esc(enName(it[0])) + '</div><div class="pt">' + esc(ptName(it[0])) + '</div></div><div class="sch">' + doneOf(bi, ii, x.n) + '/' + x.n + ' · ' + esc(it[1]) + '</div></button>'; });
    h += '</div>';
  });
  h += '<button class="btn ghost" style="margin-top:16px" data-wk="close">Sair e continuar depois</button></div>';
  if (ui.rest) h += renderRest(day);
  el.innerHTML = h;
}
function finishSession(day){
  var s = st.sess, xs = allItems(day), total = 0, done = 0;
  xs.forEach(function(x){ total += x.n; done += doneOf(x.bi, x.ii, x.n); });
  var mins = Math.max(1, Math.round(elapsed() / 60));
  var effs = Object.keys(s.eff).map(function(k){ return s.eff[k]; }), nf = effs.filter(function(e){ return e === "facil"; }).length, nd = effs.filter(function(e){ return e === "dificil"; }).length;
  var effSum = effs.length ? (nd > nf ? "difícil" : nf > effs.length / 2 ? "fácil" : "certo") : "";
  st.log.push({date:today(), key:s.key, title:day.title + (isStrength(s.key) ? " · " + s.key : ""), sets:done + "/" + total, mins:mins, light:s.light, eff:effSum});
  if (isStrength(s.key)){ st.seq = (SEQ.indexOf(s.key) + 1) % SEQ.length; if (!st.firstDate) st.firstDate = today(); }
  st.sess = null; save(); play("done");
  ui.fin = '<div class="fin"><div class="kicker">Apito final</div><div class="disp">Feito!</div><div class="stats"><div><div class="v">' + done + '/' + total + '</div><div class="l">séries</div></div><div><div class="v">' + mins + '</div><div class="l">min</div></div></div>' +
    '<div class="muted" style="margin-bottom:18px">' + (isStrength(s.key) ? "Lanche de recuperação na próxima hora. O próximo treino de ginásio é o " + nextKey() + "." : "Bom trabalho. Agora é descansar.") + '</div><button class="btn primary" data-wk="close">Voltar ao início</button></div>';
  renderWorkout();
}
function endEarly(){ if (!confirm("Terminar o treino agora? O que já fizeste fica guardado.")) return; var day = sessDay(); finishSession(day); }

/* ---------- som / ecrã ---------- */
var audioCtx = null;
function unlockAudio(){ if (!st.sound) return; try { audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); if (audioCtx.state === "suspended") audioCtx.resume(); } catch(e){} }
function tone(freq, start, dur){ try { var o = audioCtx.createOscillator(), g = audioCtx.createGain(); o.type = "sine"; o.frequency.value = freq; g.gain.value = 0.0001; o.connect(g); g.connect(audioCtx.destination); var t = audioCtx.currentTime + start; g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.3, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + dur); o.start(t); o.stop(t + dur + 0.05); } catch(e){} }
function vib(p){ try { if (navigator.vibrate) navigator.vibrate(p); } catch(e){} }
function play(name){ vib(name === "done" ? [80, 60, 80] : name === "go" ? [120] : 30); if (!st.sound || !audioCtx) return; if (name === "tick") tone(880, 0, .08); else if (name === "start") tone(660, 0, .12); else if (name === "go"){ tone(880, 0, .1); tone(1320, .12, .2); } else if (name === "done"){ tone(660, 0, .12); tone(880, .14, .12); tone(1320, .28, .3); } }
var wake = {lock:null, ns:null};
function wakeOn(){ if (!st.keepAwake) return; try { if (navigator.wakeLock) navigator.wakeLock.request("screen").then(function(l){ wake.lock = l; }).catch(wakeFallback); else wakeFallback(); } catch(e){ wakeFallback(); } }
function wakeFallback(){ try { if (window.NoSleep){ wake.ns = wake.ns || new NoSleep(); wake.ns.enable(); } } catch(e){} }
function wakeOff(){ try { if (wake.lock){ wake.lock.release(); wake.lock = null; } if (wake.ns) wake.ns.disable(); } catch(e){} }
document.addEventListener("visibilitychange", function(){ if (!document.hidden && st.sess && !document.getElementById("wk").hidden) wakeOn(); });

/* ---------- relógio ---------- */
setInterval(function(){
  if (!st.sess || document.getElementById("wk").hidden) return;
  var c = document.getElementById("clock"); if (c) c.textContent = mmss(elapsed());
  if (ui.rest){
    var left = (ui.rest.end - Date.now()) / 1000, t = document.querySelector(".restov .t"), ring = document.querySelector(".restov .ring svg");
    if (t) t.textContent = mmss(left);
    if (ring) ring.outerHTML = ringSvg(left, ui.rest.total);
    if (left <= 0) restDone();
  }
}, 250);
function restDone(){
  var r = ui.rest; ui.rest = null; play("go");
  if (r.kind === "hold"){ markSet(r.bi, r.ii); return; }
  renderWorkout();
}

/* ---------- eventos ---------- */
document.addEventListener("click", function(e){
  var t = e.target.closest("button, label, [data-tab]"); if (!t) return;
  var d = t.dataset || {};
  if (d.tab){ ui.tab = d.tab; render(); return; }
  if (d.start != null){ startSession(d.start, d.light === "1"); return; }
  if (d.game){ if (d.game === "yes") setWeek(new Date(), {game:true}); else if (d.game === "no") setWeek(new Date(), {game:false}); else openWeekEdit(); return; }
  if (d.gameday != null){ setWeek(new Date(), {game:(d.gameday === "none" ? false : parseInt(d.gameday, 10))}); closeSheet(); return; }
  if (d.week === "edit"){ openWeekEdit(); return; }
  if (d.sheet === "coach"){ openCoach(); return; }
  if (d.sheet === "alert"){ openAlert(); return; }
  if (d.preview){ openPreview(d.preview); return; }
  if (d.close){ closeSheet(); return; }
  if (t.id === "btnExport"){ exportData(); return; }
  if (t.id === "btnReset"){ if (confirm("Apagar tudo (pesos, histórico, semana) e começar do zero?")){ localStorage.removeItem(KEY); location.reload(); } return; }
  /* treino */
  if (d.set){ var p = d.set.split("."); unlockAudio(); markSet(+p[0], +p[1]); return; }
  if (d.hold){ startHold(parseInt(d.hold, 10), +d.bi, +d.ii); return; }
  if (d.skip){ var q = d.skip.split("."); skipItem(+q[0], +q[1]); return; }
  if (d.focus){ var fo = d.focus.split("."); setFocus(+fo[0], +fo[1]); return; }
  if (d.swapbtn){ var sb = d.swapbtn.split("."); openSwap(+sb[0], +sb[1]); return; }
  if (d.swap != null){ var key = st.sess.key; st.swaps[key] = st.swaps[key] || {}; if (d.name) st.swaps[key][d.swap] = [d.name, d.ref]; else delete st.swaps[key][d.swap]; save(); closeSheet(); renderWorkout(); toast(d.name ? "Trocado" : "Reposto"); return; }
  if (d.kg){ var day = sessDay(), f = focusItem(day), it = day.blocks[f.bi].items[f.ii]; changeKg(d.name, d.kg === "+" ? incOf(it) : -incOf(it), it); return; }
  if (d.sugg){ st.weights[d.sugg] = parseFloat(d.val); save(); renderWorkout(); toast("Peso atualizado"); return; }
  if (d.eff){ setEffort(d.name, d.eff); return; }
  if (d.rest){ if (d.rest === "plus"){ ui.rest.end += 15000; renderWorkout(); } else restDone(); return; }
  if (d.wk === "undo"){ undoLast(); return; }
  if (d.wk === "pause"){ var s = st.sess; if (s.running){ s.accum += Date.now() - s.startedAt; s.running = false; } else { s.running = true; s.startedAt = Date.now(); } save(); renderWorkout(); return; }
  if (d.wk === "end"){ endEarly(); return; }
  if (d.wk === "close"){ ui.fin = null; ui.rest = null; if (st.sess && st.sess.running){ st.sess.accum += Date.now() - st.sess.startedAt; st.sess.running = false; save(); } showWorkout(false); ui.tab = "home"; render(); return; }
});
document.addEventListener("change", function(e){
  var t = e.target;
  if (t.id === "bigWeek"){ setWeek(new Date(), {big:t.checked}); return; }
  if (t.id === "optSound"){ st.sound = t.checked; save(); if (t.checked) unlockAudio(); return; }
  if (t.id === "optWake"){ st.keepAwake = t.checked; save(); return; }
  if (t.id === "optRest"){ st.cfg.restDay = parseInt(t.value, 10); save(); render(); return; }
  if (t.id === "fileImport" && t.files[0]){ importData(t.files[0]); }
});
document.getElementById("sheet").addEventListener("click", function(e){ if (e.target.id === "sheet") closeSheet(); });
document.addEventListener("click", function(e){ var r = e.target.closest(".exrow.cur, .exrow"); if (!r || !r.closest("#wk") || !r.dataset.focus) return; }, true);
/* toque longo no exercício atual abre a ficha completa */
document.addEventListener("click", function(e){ var t = e.target.closest(".excard .figbox"); if (!t) return; var day = sessDay(); if (!day) return; var f = focusItem(day); if (f) openInfo(day.blocks[f.bi].items[f.ii][0]); });
if ("serviceWorker" in navigator){ window.addEventListener("load", function(){ navigator.serviceWorker.register("./sw.js").catch(function(){}); }); }
render();
if (st.sess){ showWorkout(true); renderWorkout(); }
</script>
